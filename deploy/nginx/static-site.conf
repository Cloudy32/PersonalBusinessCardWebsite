# Include this file inside the existing rbcoder.ru `server` block.
# The repository must be deployed to /var/www/rbcode.
root /var/www/rbcode/app;
index index.html;

location = /projects.html {
    return 301 "/#projects";
}

location = /services.html {
    return 301 "/#services";
}

location / {
    try_files $uri $uri/ /index.html;
}

# Never expose Git metadata, environment files or other hidden entries.
location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}
